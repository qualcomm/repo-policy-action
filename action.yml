name: Repository Policy Check
description: Enforces repository structure and policy standards for Qualcomm open-source projects. Replaces todogroup/repolinter-action.
author: Qualcomm

inputs:
  config_file:
    description: Path to a local repo-policy.json or repolint.json override at the repo root. If not provided, auto-detection is used.
    required: false
  config_url:
    description: URL to fetch the default policy config from when no local config file is found.
    default: https://raw.githubusercontent.com/qualcomm/.github/main/repolint.json
    required: false
  fail-on-error:
    description: Exit non-zero when any error-level rule fails.
    default: 'true'
    required: false
  fail-on-warning:
    description: Exit non-zero when any warning-level rule fails.
    default: 'false'
    required: false
  respect-gitignore:
    description: Skip files and directories matched by the repository's .gitignore files when evaluating rules.
    default: 'true'
    required: false

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Install Python dependencies
      shell: bash
      run: |
        uv sync --project "${{ github.action_path }}" --no-dev --frozen

    - name: Run repository policy checks
      shell: bash
      run: |
        args=(--repo-path "$GITHUB_WORKSPACE" --config-url "$CONFIG_URL")
        if [[ -n "$CONFIG_FILE" ]]; then
          args+=(--config-file "$CONFIG_FILE")
        fi
        if [[ "$FAIL_ON_ERROR" == "true" ]]; then
          args+=(--fail-on-error)
        else
          args+=(--no-fail-on-error)
        fi
        if [[ "$FAIL_ON_WARNING" == "true" ]]; then
          args+=(--fail-on-warning)
        else
          args+=(--no-fail-on-warning)
        fi
        if [[ "$RESPECT_GITIGNORE" == "true" ]]; then
          args+=(--respect-gitignore)
        else
          args+=(--no-respect-gitignore)
        fi
        uv run --project "$ACTION_PATH" --no-dev python "$ACTION_PATH/src/main.py" "${args[@]}"
      env:
        ACTION_PATH: ${{ github.action_path }}
        PYTHONPATH: ${{ github.action_path }}/src
        CONFIG_URL: ${{ inputs.config_url }}
        CONFIG_FILE: ${{ inputs.config_file }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        RESPECT_GITIGNORE: ${{ inputs.respect-gitignore }}
